<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ ↔ Codex 桥接</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#10191c;color:#ebf4f3}body{max-width:880px;margin:60px auto;padding:0 24px}small{letter-spacing:.12em;color:#80afa8}h1{font-size:34px;letter-spacing:-.03em;margin:14px 0 12px}p{color:#adc5c2;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:32px 0}.card{border:1px solid #284240;border-radius:14px;padding:22px;background:#142326}.label{font-size:13px;color:#94b0aa}.value{font-size:22px;margin-top:10px}.ok{color:#91e3c1}.bad{color:#f1be7b}.details{padding:22px;border:1px solid #284240;border-radius:14px;overflow-wrap:anywhere}code{color:#b9e4d9}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:20px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #284240}footer{font-size:12px;color:#78918d;margin:30px 0}@media(max-width:600px){.cards{grid-template-columns:1fr}body{margin-top:30px}}
</style>
<small>LOCAL MESSAGE BRIDGE</small><h1>QQ ↔ Codex</h1><p>用绑定的 QQ 联系人发送文字、图片或文件，进入当前 Codex 聊天处理，回答与交付文件自动回到同一个私聊。</p>
<div class="cards"><div class="card"><div class="label">QQ 消息连接</div><div id="qq" class="value">连接中…</div></div><div class="card"><div class="label">Codex 桌面连接</div><div id="codex" class="value">检查中…</div></div><div class="card"><div class="label">待处理消息</div><div id="queue" class="value">—</div></div></div>
<div class="details"><p id="route"></p><p id="guardian"></p><p id="error"></p><p>QQ 指令 <code>/状态</code> · <code>/暂停</code> · <code>/恢复</code> · <code>/帮助</code></p><p>从已配置的桌面或开始菜单入口打开 QQ，并打开 Codex，桥接会自动连接。任务进行中的新消息会直接作为引导送入当前轮次。</p><table><thead><tr><th>接收时间</th><th>QQ 消息编号</th><th>处理状态</th></tr></thead><tbody id="history"></tbody></table></div><footer id="updated">只显示运行状态，不展示聊天正文。</footer>
<script>
const labels={waiting_attachment:'准备附件',queued:'等待连接后投递',accepted:'Codex 已接收引导',dispatching:'投递中',completed:'处理完成',failed:'失败',needs_review:'需要核对',control:'状态指令',received:'已收到'};
async function refresh(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error('状态服务不可用');const s=await r.json();for(const [id,ok] of [['qq',s.qqConnected],['codex',s.desktopConnected]]){const el=document.getElementById(id);el.textContent=ok?'已连接':'等待连接';el.className='value '+(ok?'ok':'bad')}document.getElementById('guardian').textContent='自动连接 '+(s.autoConnectEnabled?'开启':'已手动停止')+' · '+(s.guardian?'后台守护运行中':'后台守护待启动');document.getElementById('queue').textContent=s.queued+(s.processing?' · 处理中':'')+(s.paused?' · 已暂停':'');document.getElementById('route').textContent='控制联系人：'+s.contactName+'　接收账号：'+s.accountId+'\nCodex 聊天：'+s.threadId;document.getElementById('route').style.whiteSpace='pre-line';document.getElementById('error').textContent=[s.lastError,s.deliveryWarning].filter(Boolean).join('；');const rows=s.recent.map(x=>{const tr=document.createElement('tr');[new Date(x.received_at).toLocaleTimeString('zh-CN'),x.message_id,labels[x.state]||x.state].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});return tr});document.getElementById('history').replaceChildren(...rows);document.getElementById('updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN')+' · 只显示运行状态，不展示聊天正文。'}catch(e){document.getElementById('error').textContent='桥接服务已停止。双击“启动QQ桥接.cmd”可重新启动。'}}refresh();setInterval(refresh,3000);
</script></html>
